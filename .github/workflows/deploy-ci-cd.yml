name: Production CI/CD Pipeline & ECS Rolling Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # =========================================================
  # Job 1: Quality Gate & Linting / Test Validation
  # =========================================================
  validate:
    name: Code Quality & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm Package Manager
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm Cache Directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Frontend Production Build
        run: pnpm --filter frontend run build

  # =========================================================
  # Job 2: Build Multi-Service Docker Images & Push to ECR
  # =========================================================
  build-and-push:
    name: Build & Push Docker Images to ECR
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up QEMU for Multi-Platform Builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to AWS via IAM User Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract Short Git SHA
        id: vars
        shell: bash
        run: |
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Resolve ECR Repository Name Prefix
        id: prefix
        shell: bash
        run: |
          RAW_PREFIX="${{ secrets.ECR_REPOSITORY_PREFIX }}"
          if [ -n "$RAW_PREFIX" ]; then
            echo "VAL=${RAW_PREFIX}-" >> $GITHUB_OUTPUT
          else
            echo "VAL=edunest-dev-" >> $GITHUB_OUTPUT
          fi

      - name: Ensure Required ECR Repositories Exist
        shell: bash
        run: |
          REGION="${{ secrets.AWS_REGION }}"
          PREFIX="${{ steps.prefix.outputs.VAL }}"
          REPOSITORIES=("${PREFIX}api-gateway" "${PREFIX}backend" "${PREFIX}storage-service")

          for REPO in "${REPOSITORIES[@]}"; do
            if aws ecr describe-repositories --region "$REGION" --repository-names "$REPO" >/dev/null 2>&1; then
              echo "ECR repository '$REPO' already exists."
            else
              echo "Creating missing ECR repository '$REPO'..."
              aws ecr create-repository \
                --region "$REGION" \
                --repository-name "$REPO" \
                --image-scanning-configuration scanOnPush=true >/dev/null
            fi
          done

      # Build & Push API Gateway Service
      - name: Build & Push API Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          file: ./api-gateway/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ steps.prefix.outputs.VAL }}api-gateway:sha-${{ steps.vars.outputs.SHORT_SHA }}
            ${{ steps.login-ecr.outputs.registry }}/${{ steps.prefix.outputs.VAL }}api-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build & Push Core Backend Service
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ steps.prefix.outputs.VAL }}backend:sha-${{ steps.vars.outputs.SHORT_SHA }}
            ${{ steps.login-ecr.outputs.registry }}/${{ steps.prefix.outputs.VAL }}backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build & Push Storage Microservice
      - name: Build & Push Storage Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./storage-service
          file: ./storage-service/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ steps.prefix.outputs.VAL }}storage-service:sha-${{ steps.vars.outputs.SHORT_SHA }}
            ${{ steps.login-ecr.outputs.registry }}/${{ steps.prefix.outputs.VAL }}storage-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================
  # Job 3: Zero-Downtime AWS ECS Rolling Deployment & Health Check
  # =========================================================
  deploy-ecs:
    name: Deploy to Amazon ECS & Verify Health
    needs: build-and-push
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Authenticate to AWS via IAM User Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract Short Git SHA
        id: vars
        shell: bash
        run: |
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Resolve ECR Repository Name Prefix
        id: prefix
        shell: bash
        run: |
          RAW_PREFIX="${{ secrets.ECR_REPOSITORY_PREFIX }}"
          if [ -n "$RAW_PREFIX" ]; then
            echo "VAL=${RAW_PREFIX}-" >> $GITHUB_OUTPUT
          else
            echo "VAL=edunest-dev-" >> $GITHUB_OUTPUT
          fi

      - name: Verify Active ECS Cluster
        id: check-cluster
        shell: bash
        run: |
          CLUSTER_NAME="${{ secrets.ECS_CLUSTER_NAME }}"
          if [ -z "$CLUSTER_NAME" ]; then
            CLUSTER_NAME="edunest-dev-cluster"
          fi
          REGION="${{ secrets.AWS_REGION }}"

          echo "Checking status of ECS cluster '$CLUSTER_NAME' in $REGION..."
          ACTIVE_CLUSTER=$(aws ecs describe-clusters --clusters "$CLUSTER_NAME" --region "$REGION" --query "clusters[?status=='ACTIVE'].clusterName" --output text 2>/dev/null || echo "")

          if [ -z "$ACTIVE_CLUSTER" ] || [ "$ACTIVE_CLUSTER" = "None" ]; then
            echo "::notice::ECS cluster '$CLUSTER_NAME' is not active or not provisioned yet."
            echo "::notice::Build & push to ECR completed successfully. Please run '1-Click AWS Infrastructure Provision (Apply)' workflow to create the ECS cluster and services."
            echo "SKIP=true" >> $GITHUB_OUTPUT
          else
            echo "ECS cluster '$CLUSTER_NAME' is ACTIVE."
            echo "SKIP=false" >> $GITHUB_OUTPUT
          fi

      - name: Download or Generate Task Definition
        if: steps.check-cluster.outputs.SKIP != 'true'
        shell: bash
        run: |
          TASK_DEF_NAME="${{ secrets.ECS_TASK_DEFINITION_NAME }}"
          if [ -z "$TASK_DEF_NAME" ]; then
            TASK_DEF_NAME="edunest-dev-api-gateway"
          fi
          REGION="${{ secrets.AWS_REGION }}"

          echo "Attempting to fetch active task definition '$TASK_DEF_NAME' from AWS..."
          if aws ecs describe-task-definition --task-definition "$TASK_DEF_NAME" --region "$REGION" --query taskDefinition > task-definition.json 2>/dev/null; then
            echo "Successfully fetched active task definition from AWS."
          else
            echo "No active task definition found on AWS. Generating initial task-definition.json from template..."
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            PREFIX="${{ steps.prefix.outputs.VAL }}"
            PREFIX_TRIMMED="${PREFIX%-}"
            CONTAINER_NAME="${{ secrets.ECS_CONTAINER_NAME }}"
            if [ -z "$CONTAINER_NAME" ]; then
              CONTAINER_NAME="api-gateway"
            fi

            sed \
              -e "s|\${ECS_TASK_DEFINITION_NAME}|$TASK_DEF_NAME|g" \
              -e "s|\${AWS_ACCOUNT_ID}|$ACCOUNT_ID|g" \
              -e "s|\${AWS_REGION}|$REGION|g" \
              -e "s|\${ECR_REPOSITORY_PREFIX}|$PREFIX_TRIMMED|g" \
              -e "s|\${ECR_REGISTRY}|${{ steps.login-ecr.outputs.registry }}|g" \
              -e "s|\${ECS_CONTAINER_NAME}|$CONTAINER_NAME|g" \
              .aws/task-definition-template.json > task-definition.json

            echo "Generated initial task-definition.json from template."
          fi

      - name: Render New Image in Task Definition
        if: steps.check-cluster.outputs.SKIP != 'true'
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ secrets.ECS_CONTAINER_NAME || 'api-gateway' }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ steps.prefix.outputs.VAL }}api-gateway:sha-${{ steps.vars.outputs.SHORT_SHA }}

      - name: Deploy Updated Task Definition to Amazon ECS
        if: steps.check-cluster.outputs.SKIP != 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE_NAME || 'edunest-dev-api-gateway-service' }}
          cluster: ${{ secrets.ECS_CLUSTER_NAME || 'edunest-dev-cluster' }}
          wait-for-service-stability: true

      - name: Verify ALB Live Endpoint Health Check
        if: steps.check-cluster.outputs.SKIP != 'true'
        shell: bash
        run: |
          HEALTH_URL="${{ secrets.ALB_HEALTH_CHECK_URL }}"
          if [ -z "$HEALTH_URL" ]; then
            echo "ALB_HEALTH_CHECK_URL secret is not set; skipping live health check."
            exit 0
          fi

          echo "Verifying ALB target group health check at $HEALTH_URL..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
          if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 301 ] || [ "$STATUS" -eq 302 ]; then
            echo "Deployment healthy! HTTP Status: $STATUS"
          else
            echo "Warning: Health check returned HTTP Status $STATUS"
          fi
