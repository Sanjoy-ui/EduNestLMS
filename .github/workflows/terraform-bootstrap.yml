name: 1-Click Terraform State Backend Bootstrap (Run Once)

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Environment to bootstrap state backend for'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

jobs:
  bootstrap-backend:
    name: Bootstrap S3 State Backend & DynamoDB Lock Table
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to AWS via IAM User Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Resolve State Bucket Name
        id: bucket
        shell: bash
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="edunest-lms-tf-state-${ACCOUNT_ID}"
          echo "BUCKET_NAME=${BUCKET_NAME}" >> $GITHUB_OUTPUT
          echo "ACCOUNT_ID=${ACCOUNT_ID}" >> $GITHUB_OUTPUT
          echo "State bucket will be: ${BUCKET_NAME}"

      - name: Create S3 State Bucket (if not exists)
        shell: bash
        run: |
          BUCKET="${{ steps.bucket.outputs.BUCKET_NAME }}"
          REGION="${{ secrets.AWS_REGION }}"

          # Check if bucket already exists
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "S3 bucket '$BUCKET' already exists — skipping creation."
          else
            echo "Creating S3 state bucket: $BUCKET in $REGION..."
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket \
                --bucket "$BUCKET" \
                --region "$REGION"
            else
              aws s3api create-bucket \
                --bucket "$BUCKET" \
                --region "$REGION" \
                --create-bucket-configuration LocationConstraint="$REGION"
            fi
            echo "S3 bucket created."
          fi

          # Enable versioning for state file safety
          aws s3api put-bucket-versioning \
            --bucket "$BUCKET" \
            --versioning-configuration Status=Enabled

          # Enable server-side encryption
          aws s3api put-bucket-encryption \
            --bucket "$BUCKET" \
            --server-side-encryption-configuration '{
              "Rules": [{
                "ApplyServerSideEncryptionByDefault": {
                  "SSEAlgorithm": "AES256"
                }
              }]
            }'

          # Block all public access
          aws s3api put-public-access-block \
            --bucket "$BUCKET" \
            --public-access-block-configuration \
              "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"

          echo "S3 bucket '$BUCKET' is ready with versioning + encryption + public access blocked."

      - name: Create DynamoDB Lock Table (if not exists)
        shell: bash
        run: |
          TABLE_NAME="edunest-lms-terraform-locks"
          REGION="${{ secrets.AWS_REGION }}"

          # Check if table already exists
          if aws dynamodb describe-table --table-name "$TABLE_NAME" --region "$REGION" 2>/dev/null; then
            echo "DynamoDB table '$TABLE_NAME' already exists — skipping creation."
          else
            echo "Creating DynamoDB lock table: $TABLE_NAME..."
            aws dynamodb create-table \
              --table-name "$TABLE_NAME" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$REGION"

            # Wait for table to be active
            aws dynamodb wait table-exists --table-name "$TABLE_NAME" --region "$REGION"
            echo "DynamoDB lock table '$TABLE_NAME' is active."
          fi

      - name: Print Next Steps
        shell: bash
        run: |
          BUCKET="${{ steps.bucket.outputs.BUCKET_NAME }}"
          ACCOUNT="${{ steps.bucket.outputs.ACCOUNT_ID }}"
          REGION="${{ secrets.AWS_REGION }}"

          echo ""
          echo "=========================================="
          echo "  Bootstrap Complete!"
          echo "=========================================="
          echo ""
          echo "S3 Bucket:      $BUCKET"
          echo "DynamoDB Table: edunest-lms-terraform-locks"
          echo "Region:         $REGION"
          echo ""
          echo "Add the following GitHub Actions Secret:"
          echo "  TF_STATE_BUCKET = $BUCKET"
          echo ""
          echo "Now run '1-Click AWS Infrastructure Provision (Apply)' to provision infrastructure."
          echo "State will be stored remotely in S3 — destroy will work reliably from now on."
