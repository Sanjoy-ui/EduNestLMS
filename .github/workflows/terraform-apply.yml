name: 1-Click AWS Infrastructure Provision (Apply)

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target Environment to Provision'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

jobs:
  terraform-apply:
    name: Execute Terraform Apply (Provision AWS Infrastructure)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Authenticate to AWS via IAM User Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Initialize Terraform with remote S3 backend so state persists
      # between runs. The TF_STATE_BUCKET secret is the bucket name
      # created by the terraform-bootstrap.yml workflow.
      - name: Initialize Terraform with Remote S3 Backend
        shell: bash
        run: |
          cd iac/environments/${{ inputs.target_environment }}
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -reconfigure

      - name: Recover Stale Terraform State Lock (if present)
        shell: bash
        run: |
          set -euo pipefail
          cd iac/environments/${{ inputs.target_environment }}

          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq is required for lock inspection but is not installed."
            exit 1
          fi

          LOCK_TABLE=$(awk -F'"' '/dynamodb_table/ {print $2; exit}' backend.tf)
          STATE_KEY=$(awk -F'"' '/key[[:space:]]*=/{print $2; exit}' backend.tf)

          if [ -z "$LOCK_TABLE" ] || [ -z "$STATE_KEY" ]; then
            echo "No Terraform DynamoDB lock configuration found in backend.tf; skipping lock recovery."
            exit 0
          fi

          echo "Inspecting lock table '$LOCK_TABLE' for state key '$STATE_KEY'..."
          LOCK_SCAN_OUTPUT=$(aws dynamodb scan \
            --table-name "$LOCK_TABLE" \
            --filter-expression "contains(LockID, :state_key)" \
            --expression-attribute-values "{\":state_key\":{\"S\":\"$STATE_KEY\"}}" \
            --projection-expression "LockID,Info")

          LOCK_ITEM_COUNT=$(echo "$LOCK_SCAN_OUTPUT" | jq -r '.Count // 0')
          if [ "$LOCK_ITEM_COUNT" -eq 0 ]; then
            echo "No existing Terraform state lock entry found."
            exit 0
          fi

          LOCK_INFO=$(echo "$LOCK_SCAN_OUTPUT" | jq -r '.Items[]? | select(.Info != null and .Info.S != null) | .Info.S' | head -n 1)
          if [ -z "$LOCK_INFO" ]; then
            echo "No active lock payload found in DynamoDB table; proceeding."
          else
            LOCK_ID=$(echo "$LOCK_INFO" | jq -r '.ID // empty')
            LOCK_OPERATION=$(echo "$LOCK_INFO" | jq -r '.Operation // empty')
            LOCK_CREATED=$(echo "$LOCK_INFO" | jq -r '.Created // empty')
            LOCK_WHO=$(echo "$LOCK_INFO" | jq -r '.Who // empty')

            if [ -z "$LOCK_ID" ]; then
              echo "::error::Unable to parse Terraform lock ID from DynamoDB lock record."
              echo "$LOCK_INFO"
              exit 1
            fi

            if [ "$LOCK_OPERATION" = "OperationTypeInvalid" ]; then
              echo "Detected stale invalid Terraform lock:"
              echo "  ID: $LOCK_ID"
              echo "  Operation: $LOCK_OPERATION"
              echo "  Created: $LOCK_CREATED"
              echo "  Who: $LOCK_WHO"
              echo "Releasing stale lock with terraform force-unlock..."
              terraform force-unlock -force "$LOCK_ID"
            else
              echo "Terraform lock exists but is not marked invalid (operation: ${LOCK_OPERATION:-unknown})."
              echo "::error::Refusing automatic unlock to avoid interrupting a legitimate active run."
              exit 1
            fi
          fi

      - name: Import Existing ECS Capacity Provider into Terraform State (if needed)
        if: inputs.target_environment == 'dev'
        shell: bash
        run: |
          set -euo pipefail
          cd iac/environments/${{ inputs.target_environment }}

          echo "Resolving ECS capacity provider name from Terraform variables..."
          PREFIX=$(awk -F'=' '/prefix[[:space:]]*=/ {print $2}' "${{ inputs.target_environment }}.tfvars" | tr -d '"[:space:]')
          if [ -z "$PREFIX" ]; then
            PREFIX="edunest-${{ inputs.target_environment }}"
          fi
          CAPACITY_PROVIDER_NAME="${PREFIX}-capacity-provider"

          if [ -z "$CAPACITY_PROVIDER_NAME" ]; then
            echo "::error::Failed to resolve ECS capacity provider name."
            exit 1
          fi

          echo "Resolved capacity provider: $CAPACITY_PROVIDER_NAME"
          echo "Checking whether an ACTIVE capacity provider exists in AWS..."

          CP_STATUS=$(aws ecs describe-capacity-providers \
            --capacity-providers "$CAPACITY_PROVIDER_NAME" \
            --region "${{ secrets.AWS_REGION }}" \
            --query "capacityProviders[0].status" \
            --output text 2>/dev/null || echo "NOT_FOUND")

          echo "  Status: $CP_STATUS"

          if [ "$CP_STATUS" = "ACTIVE" ]; then
            echo "Capacity provider is ACTIVE in AWS."
            if ! terraform state show module.ecs_ec2.aws_ecs_capacity_provider.cas >/dev/null 2>&1; then
              echo "Importing existing ECS capacity provider: $CAPACITY_PROVIDER_NAME"
              timeout 180s terraform import \
                -var-file="${{ inputs.target_environment }}.tfvars" \
                module.ecs_ec2.aws_ecs_capacity_provider.cas \
                "$CAPACITY_PROVIDER_NAME"
            else
              echo "ECS capacity provider already tracked in Terraform state."
            fi
          elif [ "$CP_STATUS" = "INACTIVE" ]; then
            echo "Capacity provider is INACTIVE (orphan from deleted cluster) - skipping import."
            echo "Terraform will wait for it to be fully deleted and create a fresh one."
          else
            echo "No pre-existing ACTIVE capacity provider found; Terraform will create it."
          fi

      - name: Import Pre-existing ECR Repositories into Terraform State (if needed)
        shell: bash
        run: |
          set -euo pipefail
          cd iac/environments/${{ inputs.target_environment }}

          # Resolve prefix from tfvars (same approach as capacity provider step)
          PREFIX=$(awk -F'=' '/prefix[[:space:]]*=/ {print $2}' "${{ inputs.target_environment }}.tfvars" | tr -d '"[:space:]')
          if [ -z "$PREFIX" ]; then
            PREFIX="edunest-${{ inputs.target_environment }}"
          fi

          REPOS=("api-gateway" "backend" "storage-service")

          for REPO in "${REPOS[@]}"; do
            REPO_NAME="${PREFIX}-${REPO}"
            TF_ADDR="module.ecr.aws_ecr_repository.services[\"${REPO}\"]"
            TF_POLICY_ADDR="module.ecr.aws_ecr_lifecycle_policy.services_policy[\"${REPO}\"]"

            echo "--- Checking ECR repo: $REPO_NAME ---"

            # Check if repo exists in AWS
            if aws ecr describe-repositories --repository-names "$REPO_NAME" --region "${{ secrets.AWS_REGION }}" >/dev/null 2>&1; then
              echo "  Repo '$REPO_NAME' exists in AWS."

              # Import repo if not already tracked in state
              if ! terraform state show "$TF_ADDR" >/dev/null 2>&1; then
                echo "  Importing $TF_ADDR..."
                terraform import \
                  -var-file="${{ inputs.target_environment }}.tfvars" \
                  "$TF_ADDR" \
                  "$REPO_NAME"
                echo "  Imported successfully."
              else
                echo "  Already tracked in Terraform state - skipping import."
              fi

              # Import lifecycle policy if not already tracked in state
              if ! terraform state show "$TF_POLICY_ADDR" >/dev/null 2>&1; then
                echo "  Importing lifecycle policy $TF_POLICY_ADDR..."
                terraform import \
                  -var-file="${{ inputs.target_environment }}.tfvars" \
                  "$TF_POLICY_ADDR" \
                  "$REPO_NAME"
                echo "  Lifecycle policy imported successfully."
              else
                echo "  Lifecycle policy already tracked in Terraform state - skipping import."
              fi
            else
              echo "  Repo '$REPO_NAME' does not exist in AWS - Terraform will create it."
            fi
          done

      - name: Execute Terraform Apply (-auto-approve)
        shell: bash
        run: |
          cd iac/environments/${{ inputs.target_environment }}
          echo "Executing 1-Click AWS Infrastructure Provisioning for ${{ inputs.target_environment }}..."
          terraform apply \
            -auto-approve \
            -var-file="${{ inputs.target_environment }}.tfvars"

      - name: Print Infrastructure Outputs
        shell: bash
        run: |
          cd iac/environments/${{ inputs.target_environment }}
          echo ""
          echo "=========================================="
          echo "  Infrastructure Provisioned Successfully!"
          echo "=========================================="
          terraform output
          echo ""
          echo "State saved to S3 bucket: ${{ secrets.TF_STATE_BUCKET }}"
          echo "Run '1-Click Destroy' workflow to tear everything down."
