name: 1-Click AWS Full Infrastructure Destroy (Zero Cost)

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target Environment to Destroy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      confirm_destroy:
        description: 'Type DESTROY to confirm wiping all AWS infrastructure'
        required: true
        default: 'DESTROY'
        type: string

permissions:
  contents: read

jobs:
  terraform-destroy:
    name: Execute Terraform Destroy (Wipe AWS Resources)
    runs-on: ubuntu-latest

    steps:
      - name: Verify Safety Confirmation Input
        if: ${{ inputs.confirm_destroy != 'DESTROY' }}
        shell: bash
        run: |
          echo "Aborting destroy operation! You must type DESTROY in the confirmation field."
          exit 1

      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Authenticate to AWS via IAM User Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Initialize Terraform
        shell: bash
        run: |
          cd iac/environments/${{ inputs.target_environment }}
          terraform init

      - name: Execute Terraform Destroy (-auto-approve)
        shell: bash
        run: |
          cd iac/environments/${{ inputs.target_environment }}
          echo "Executing 1-Click AWS Infrastructure Destroy for ${{ inputs.target_environment }}..."
          terraform destroy -auto-approve -var-file="${{ inputs.target_environment }}.tfvars" || true
          echo "All AWS resources (ALB, ECS, EC2, ECR, VPC) have been completely wiped out! $0 AWS bill guaranteed."
