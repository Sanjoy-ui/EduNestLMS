name: edunest-lms

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lms-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lms-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:5000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  storage-service:
    build:
      context: ./storage-service
      dockerfile: Dockerfile
    container_name: lms-storage-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - ./storage-service/.env
    environment:
      - NODE_ENV=production
      - PORT=5001
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:5001/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: lms-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./api-gateway/.env
    environment:
      - NODE_ENV=production
      - PORT=8080
      - BACKEND_SERVICE_URL=http://backend:5000
      - STORAGE_SERVICE_URL=http://storage-service:5001
    depends_on:
      - backend
      - storage-service
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s


